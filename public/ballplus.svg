<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Ball+ favicon</title>
  <defs>
    <clipPath id="ball-clip">
      <circle cx="29" cy="35" r="17.5"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="#171717" />

  <!-- Painel e costuras recortados pelo limite circular da bola -->
  <g clip-path="url(#ball-clip)">
    <path d="M29 25.4 36.2 30.6 33.5 39.1 24.5 39.1 21.8 30.6Z"
          fill="#007a55" stroke="#F5F7F4" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M29 25.4 29 16.5
             M36.2 30.6 46.8 26.5
             M33.5 39.1 42.2 47.0
             M24.5 39.1 15.8 47.0
             M21.8 30.6 11.2 26.5"
          fill="none" stroke="#F5F7F4" stroke-width="2.3"
          stroke-linecap="butt" stroke-linejoin="round"/>
  </g>

  <!-- Contorno desenhado por cima das costuras para uma borda precisa -->
  <circle cx="29" cy="35" r="17.5"
          fill="none" stroke="#F5F7F4" stroke-width="3.2"/>

  <!-- Sinal de adição -->
  <path d="M49 8.5v12 M43 14.5h12"
        fill="none" stroke="#007a55" stroke-width="4.2" stroke-linecap="round"/>
</svg>
