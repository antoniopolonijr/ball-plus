name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      # The DB module asserts that DATABASE_URL exists at import time.
      # Unit tests mock database access; never use a production URL here.
      DATABASE_URL: postgresql://test:test@localhost/ballplus_test?sslmode=require
      HEXCLAVE_PROJECT_ID: ${{ secrets.HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' }}
        run: npm run build

      - name: Explain skipped build
        if: ${{ env.HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' }}
        run: echo "Build skipped: configure HEXCLAVE_PROJECT_ID and HEXCLAVE_SECRET_SERVER_KEY repository secrets."

  e2e:
    name: Public end-to-end tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost/ballplus_test?sslmode=require
      HEXCLAVE_PROJECT_ID: ${{ secrets.HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run public E2E tests
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' }}
        run: npm run test:e2e:ci

      - name: Explain skipped E2E tests
        if: ${{ env.HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' }}
        run: echo "E2E tests skipped: configure HEXCLAVE_PROJECT_ID and HEXCLAVE_SECRET_SERVER_KEY repository secrets."
