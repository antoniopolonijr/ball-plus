name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://test:test@localhost/ballplus_test?sslmode=require' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${{ secrets.TEST_NEXT_PUBLIC_HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.TEST_HEXCLAVE_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.TEST_DATABASE_URL != '' }}
        run: npm run build

      - name: Explain skipped build
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' || env.TEST_DATABASE_URL == '' }}
        run: |
          echo "Build skipped: configure TEST_NEXT_PUBLIC_HEXCLAVE_PROJECT_ID, TEST_HEXCLAVE_SECRET_SERVER_KEY and TEST_DATABASE_URL repository secrets."

  e2e:
    name: Public and authenticated end-to-end tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
      NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${{ secrets.TEST_NEXT_PUBLIC_HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.TEST_HEXCLAVE_SECRET_SERVER_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_SECONDARY_USER_EMAIL: ${{ secrets.TEST_SECONDARY_USER_EMAIL }}
      TEST_SECONDARY_USER_PASSWORD: ${{ secrets.TEST_SECONDARY_USER_PASSWORD }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.TEST_BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run public E2E smoke tests
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' }}
        run: npx playwright test test/e2e/public-navigation.spec.ts --project=chromium-unauthenticated --reporter=list

      - name: Explain skipped public E2E tests
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' || env.DATABASE_URL == '' }}
        run: |
          echo "Public E2E tests skipped: configure TEST_NEXT_PUBLIC_HEXCLAVE_PROJECT_ID, TEST_HEXCLAVE_SECRET_SERVER_KEY and TEST_DATABASE_URL."

      - name: Apply test database migrations
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != '' && env.TEST_USER_EMAIL != '' && env.TEST_USER_PASSWORD != '' && env.TEST_SECONDARY_USER_EMAIL != '' && env.TEST_SECONDARY_USER_PASSWORD != '' }}
        run: npm run db:migrate

      - name: Run authenticated saved-game E2E tests
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != '' && env.TEST_USER_EMAIL != '' && env.TEST_USER_PASSWORD != '' && env.TEST_SECONDARY_USER_EMAIL != '' && env.TEST_SECONDARY_USER_PASSWORD != '' }}
        run: npx playwright test --project=chromium-authenticated --reporter=list

      - name: Explain skipped authenticated E2E tests
        if: ${{ env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' || env.DATABASE_URL == '' || env.DATABASE_URL_UNPOOLED == '' || env.TEST_USER_EMAIL == '' || env.TEST_USER_PASSWORD == '' || env.TEST_SECONDARY_USER_EMAIL == '' || env.TEST_SECONDARY_USER_PASSWORD == '' }}
        run: |
          echo "Authenticated E2E tests skipped: configure TEST_NEXT_PUBLIC_HEXCLAVE_PROJECT_ID, TEST_HEXCLAVE_SECRET_SERVER_KEY, TEST_DATABASE_URL, TEST_DATABASE_URL_UNPOOLED, TEST_USER_EMAIL, TEST_USER_PASSWORD, TEST_SECONDARY_USER_EMAIL and TEST_SECONDARY_USER_PASSWORD."

      - name: Note about Blob cover scenario
        if: ${{ env.BLOB_READ_WRITE_TOKEN == '' && env.NEXT_PUBLIC_HEXCLAVE_PROJECT_ID != '' }}
        run: |
          echo "The saved-game cover upload scenario will be skipped unless TEST_BLOB_READ_WRITE_TOKEN is configured. The test store must be separate from production."
