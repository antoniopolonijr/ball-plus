name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      # Unit tests mock database access. Keep a harmless fallback for imports.
      # Build only runs when the dedicated test credentials are all configured.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://test:test@localhost/ballplus_test?sslmode=require' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      HEXCLAVE_PROJECT_ID: ${{ secrets.TEST_HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.TEST_HEXCLAVE_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.TEST_DATABASE_URL != '' }}
        run: npm run build

      - name: Explain skipped build
        if: ${{ env.HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' || env.TEST_DATABASE_URL == '' }}
        run: |
          echo "Build skipped: configure TEST_HEXCLAVE_PROJECT_ID, TEST_HEXCLAVE_SECRET_SERVER_KEY and TEST_DATABASE_URL repository secrets."

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
      HEXCLAVE_PROJECT_ID: ${{ secrets.TEST_HEXCLAVE_PROJECT_ID }}
      HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.TEST_HEXCLAVE_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != '' }}
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != '' }}
        run: npm run db:migrate

      - name: Run E2E tests
        if: ${{ env.HEXCLAVE_PROJECT_ID != '' && env.HEXCLAVE_SECRET_SERVER_KEY != '' && env.DATABASE_URL != '' && env.DATABASE_URL_UNPOOLED != '' }}
        run: npm run test:e2e:ci

      - name: Explain skipped E2E tests
        if: ${{ env.HEXCLAVE_PROJECT_ID == '' || env.HEXCLAVE_SECRET_SERVER_KEY == '' || env.DATABASE_URL == '' || env.DATABASE_URL_UNPOOLED == '' }}
        run: |
          echo "E2E tests skipped: configure TEST_HEXCLAVE_PROJECT_ID, TEST_HEXCLAVE_SECRET_SERVER_KEY, TEST_DATABASE_URL and TEST_DATABASE_URL_UNPOOLED repository secrets."
